[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anneal-memory"
version = "0.9.10.dev0"
description = "Living memory for AI agents. Episodes compress into identity."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Phill Clapham", email = "phill@claphamdigital.com" },
]
keywords = [
    "ai",
    "agents",
    "memory",
    "mcp",
    "compression",
    "identity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/phillipclapham/anneal-memory"
Repository = "https://github.com/phillipclapham/anneal-memory"
Issues = "https://github.com/phillipclapham/anneal-memory/issues"

[project.scripts]
anneal-memory = "anneal_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["anneal_memory"]

[tool.hatch.build.targets.sdist]
# ⛔ DEFAULT-DENY, AND THE DEFAULT-DENY IS THE WHOLE POINT.
#
# Until 2026-09-04 there was no sdist target at all, so the sdist took
# hatchling's default — THE ENTIRE VCS TREE. The wheel was never affected
# (``packages`` above scopes it), which is why this survived nine releases:
# the artifact almost everyone consumes was clean, and the one that was not
# is the one nobody looks inside. Measured at 06e5858: 1,436,684 bytes
# carrying 39 ``project_memory/`` files — six Diogenes review reports
# enumerating OPEN, UNFIXED defects in the shipped product by file and line,
# hostile-test receipts, and three files holding the operator's absolute home
# path. A PyPI sdist cannot be reliably unpublished; HEAD is 0.9.10.dev0 and
# nothing has shipped, so this was catchable exactly once.
#
# ⚠ IT IS AN ALLOWLIST, NOT ``exclude = ["project_memory"]``, AND THAT IS A
# DELIBERATE CHOICE ABOUT THE NEXT ONE. A denylist only ever catches the name
# you already know — it would have needed someone to predict ``project_memory``
# before it existed, and it will need them to predict whatever internal-notes
# directory lands next. Default-deny inverts the failure: a new top-level entry
# is OUT until someone states why it should ship. The only line in this file
# that had ever noticed ``project_memory/`` was special told RUFF, not the
# BUILD — a rule aimed at one name, doing nothing for the class.
#
# The property each entry below was graded against: AN SDIST CARRIES WHAT A
# CONSUMER NEEDS TO BUILD, INSTALL, TEST AND LEGALLY REDISTRIBUTE THIS PACKAGE
# FROM SOURCE — plus whatever the shipped README's own relative links require,
# since ``readme =`` makes README.md the package description and a dangling
# link in it is a defect in the distribution. It does NOT carry the project's
# internal development record: how work was tracked, what was reviewed, or what
# is still broken.
#
# Kept, with the reason each is not optional:
#   anneal_memory  the package source
#   tests          "test from source"; several tests read repo-root files via
#                  ``Path(anneal_memory.__file__).parent.parent``, so they only
#                  pass from a source tree — this one — and not from site-packages
#   docs           14 files; README's integration table links every one of them
#   examples       README links them AND test_integrity.py hard-asserts they exist
#   skill          README links it AND test_integrity.py:547 hard-asserts SKILL.md
#   README.md      ``readme =`` target; PKG-INFO embeds it
#   CHANGELOG.md   the release record, and test_integrity.py reads it
#   LICENSE        legal redistribution
#   server.json    MCP registry manifest; test_integrity.py asserts on its versions
#   logo-400.png   README.md:4 embeds it by relative path
#   /tool-integrity.json  the repo-root copy. Nothing reads it — the package
#                  copy (verified at server startup, asserted by the suite) ships
#                  under ``/anneal_memory`` and needs no entry of its own. The
#                  root copy is public already, costs 1.5 KB, and belongs to the
#                  integrity story rather than to this disclosure fix, so it is
#                  kept deliberately rather than by oversight. Two copies that
#                  nothing pins together can drift.
#                  ⛔ ANCHORED SINCE 2026-09-05, and the note that used to sit
#                  here was the reason it was not: it claimed one unanchored
#                  pattern was needed to match BOTH copies. FALSE, and measured
#                  — under ``/tool-integrity.json`` hatchling's own
#                  ``recurse_included_files`` still ships both, because
#                  ``/anneal_memory`` already carries the package one. The
#                  unanchored form bought nothing and cost the anchoring
#                  invariant three lines below: with
#                  ``project_memory/testbed/tool-integrity.json`` planted in a
#                  clone, the sdist admitted it. Anchored: ``[]``.
#
# Dropped: project_memory (the reported site), .github, Dockerfile, scripts
# (contributor git hooks), glama.json (third-party directory metadata),
# logo.png (144 KB, referenced by nothing in the repo — logo-400.png is the one
# README uses).
#
# ⛔ NOT DROPPABLE, and ``.gitignore`` sat in the list above until 2026-09-05
# claiming otherwise: ``.gitignore`` and ``pyproject.toml`` SHIP regardless of
# this list. hatchling adds ``get_default_build_data()['force_include']``
# unconditionally at build time and it bypasses ``include`` entirely —
# pyproject.toml, the ``readme =`` target, the license, and every VCS ignore
# file. ``tests/test_packaging.py``'s ``EXPECTED_SDIST_TOP_LEVEL`` already
# carried ``.gitignore`` with that exact reason attached, so the two records of
# one decision disagreed and the test was the right one. MEASURED by building:
# ``tar tzf`` on a real sdist lists ``.gitignore`` and ``pyproject.toml``.
# Nothing hazardous ships — but this block is the repo's written record of what
# a public, effectively unretractable artifact contains, and one line of it had
# not been derived. Its closing sentence is "Verified by building, not by
# reading."
#
# ⚠ EVERY PATTERN IS ANCHORED WITH A LEADING SLASH ON PURPOSE. These are
# gitignore-style patterns: an unanchored ``README.md`` matches at ANY depth and
# would have re-admitted ``project_memory/testbed/README.md`` — the fix quietly
# reopening the hole it closed. Verified by building, not by reading.
#
# tests/test_packaging.py pins this against hatchling's real file-selection API
# (confirmed to reproduce the tarball exactly, 112/112 files at 06e5858). If you
# add a top-level entry, that test fails until you decide whether it ships.
include = [
    "/anneal_memory",
    "/tests",
    "/docs",
    "/examples",
    "/skill",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/server.json",
    "/logo-400.png",
    "/tool-integrity.json",
]

[tool.ruff]
# ``project_memory/`` holds project-tracking documents and the ARCHIVED Phase-1
# hostile-testing scripts, which moved into this repo on 2026-09-04 with the
# project memory. They are receipts of what was run then, not package source —
# linting them added 52 findings to a baseline that is otherwise a real signal,
# and "fixing" a receipt would edit the evidence. Excluded, not silenced.
exclude = ["project_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
# Targets the library source only — tests use monkeypatching that
# mypy doesn't play well with and aren't worth the annotation tax.
# Run via `uvx mypy anneal_memory/` (no dev-dep required) or install
# mypy locally. This block exists to widen TypedDict key-typo
# protection from the two runtime drift tests
# (test_prepare_wrap_result_has_declared_keys /
# test_save_continuity_result_has_declared_keys) to all five
# declared shapes (PrepareWrapResult, SaveContinuityResult,
# WrapPackageDict, StalePatternDict, WrapSnapshot). See
# 10.5c.3 rationale in the session archive.
files = ["anneal_memory"]
python_version = "3.10"
# Not strict — the codebase is well-annotated but wasn't written
# with mypy as a gate. Starting strict would surface a large
# backlog of cosmetic findings; we start permissive and tighten
# incrementally as the codebase catches up.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Check unannotated function bodies too so the TypedDict key-typo
# protection actually fires on helper functions, not just typed
# public API.
check_untyped_defs = true
